# nginx.conf for AutoBreadboard frontend (nginxinc/nginx-unprivileged:alpine).
# Serves the SvelteKit adapter-static build on :8080. No /api proxying:
# the browser hits the API at `window.__AUTOBREADBOARD_CONFIG__.apiBaseUrl`,
# which the upstream Ingress / runtime-config.js rewrites per environment.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any unknown path falls back to index.html so SvelteKit's
    # client-side router can take over.
    try_files $uri $uri/ /index.html;

    # Long-cache hashed assets emitted by Vite into /_app/immutable/...
    # and /assets/...; everything else stays short-lived.
    location ~* ^/_app/immutable/.* {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* ^/assets/.* {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Runtime config injected by the upstream ConfigMap (k8s) or dev tooling.
    # Always serve fresh — rotating it without a redeploy is the whole point.
    location = /runtime-config.js {
        add_header Cache-Control "no-store" always;
        add_header Content-Type "application/javascript" always;
    }

    # Cheap liveness probe used by the Helm chart and Compose healthchecks.
    location = /healthz {
        default_type text/plain;
        return 200 "ok";
    }

    # Security headers applied to every response that passes through nginx.
    # `always` ensures they survive 4xx/5xx responses too.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    # Hide nginx version on error pages.
    server_tokens off;

    # Gzip the textual payloads. SVG is included because the export endpoint
    # serves it (same origin) when navigated to directly.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;
}