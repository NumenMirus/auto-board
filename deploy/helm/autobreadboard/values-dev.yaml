# Kind / local-dev overrides. Image pullPolicy: Never because kind loads the
# local docker images with `kind load docker-image` (addendum §12); do not
# expect registry connectivity in this environment.
#
# NOTE on Postgres/Redis/S3 in kind: this chart does not ship a dev-dependencies
# subchart. The dev Secret below points at in-namespace service DNS names
# (`postgres.autobreadboard.svc.cluster.local:5432`, etc.) and a follow-up
# `deploy/local/dev-dependencies.yaml` is expected to provide those Services.
# Until that lands, override secrets.dev.* here with a reachable host (e.g.
# `host.docker.internal:5432` if running an external Compose stack on the host).

global:
  environment: development
  imagePullSecrets: []

api:
  image:
    repository: autobreadboard-api
    tag: latest
    pullPolicy: Never
  replicaCount: 1

worker:
  image:
    repository: autobreadboard-api
    tag: latest
    pullPolicy: Never
  replicaCount: 1

frontend:
  image:
    repository: autobreadboard-frontend
    tag: latest
    pullPolicy: Never
  replicaCount: 1

ingress:
  enabled: true
  className: nginx
  annotations: {}
  hosts:
    - host: autobreadboard.localtest.me
      paths:
        - path: /
          pathType: Prefix
          service: frontend
        - path: /api
          pathType: Prefix
          service: api
  tls: []

config:
  environment: development
  logLevel: DEBUG
  corsOrigins:
    - http://localhost:8080
    - http://autobreadboard.localtest.me
  trustedHosts:
    - localhost
    - autobreadboard.localtest.me

secrets:
  existingSecret: ""
  dev:
    enabled: true
    secretName: ""
    # Plausible in-namespace DNS names. Replace these once
    # deploy/local/dev-dependencies.yaml exists, or point at an external
    # Compose stack via host.docker.internal:5432/6379/9000.
    databaseUrl: "postgresql+asyncpg://autobreadboard:autobreadboard@postgres.autobreadboard.svc.cluster.local:5432/autobreadboard"
    redisUrl: "redis://redis.autobreadboard.svc.cluster.local:6379/0"
    s3AccessKeyId: "minioadmin"
    s3SecretAccessKey: "minioadmin"

s3:
  endpointUrl: "http://minio.autobreadboard.svc.cluster.local:9000"
  region: us-east-1
  bucket: autobreadboard
  usePathStyle: "true"

networkPolicy:
  enabled: false

migration:
  enabled: true

podDisruptionBudget:
  enabled: false

serviceMonitor:
  enabled: false
