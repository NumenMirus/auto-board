apiVersion: v1
kind: Service
metadata:
  name: {{ include "autobreadboard.fullname" . }}-frontend
  labels:
    {{- include "autobreadboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "autobreadboard.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
