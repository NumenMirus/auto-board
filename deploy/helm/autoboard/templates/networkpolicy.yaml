{{- if .Values.networkPolicy.enabled -}}
{{- /* Deny-by-default plus the six allowances from addendum §8.3, split into
       three NetworkPolicy resources for readability:
         (1) DefaultDeny — empty podSelector, denies ingress AND egress
         (2) AppIngress  — ingress-nginx → frontend, ingress-nginx → api,
                            frontend → api, Prometheus → /metrics (api+worker)
         (3) AppEgress   — api/worker → DB/Redis/S3, DNS to kube-dns
       Note on (3): external Postgres/Redis/S3 endpoints (staging/production)
       are not in-cluster pods, so this chart allows egress on the
       DB/Redis/S3 ports to any destination. `networkPolicy.allowedEgressCidrs`
       may be set to narrow this to the corporate CIDR block when known. */ -}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "autobreadboard.fullname" . }}-default-deny
  labels:
    {{- include "autobreadboard.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "autobreadboard.fullname" . }}-ingress-allow
  labels:
    {{- include "autobreadboard.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "autobreadboard.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # ingress-nginx controller → frontend (8080) and api (8000)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace | default "ingress-nginx" }}
      ports:
        - port: 8080
          protocol: TCP
        - port: 8000
          protocol: TCP
    # frontend → api (when frontend calls the API in-cluster via Service DNS)
    - from:
        - podSelector:
            matchLabels:
              {{- include "autobreadboard.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: frontend
      ports:
        - port: 8000
          protocol: TCP
    # Prometheus → /metrics on api (8000) and worker (9100)
    {{- if .Values.networkPolicy.monitoringNamespace }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.monitoringNamespace }}
      ports:
        - port: 8000
          protocol: TCP
        - port: {{ .Values.worker.metricsPort | default 9100 }}
          protocol: TCP
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "autobreadboard.fullname" . }}-egress-allow
  labels:
    {{- include "autobreadboard.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "autobreadboard.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    # DNS → kube-dns (UDP+TCP 53)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # api + worker → Postgres (5432) / Redis (6379) / S3-compatible (443).
    # In staging/production these are external endpoints, so we allow egress
    # to the configured CIDRs (defaults to 0.0.0.0/0 — narrow in real values).
    - to:
        {{- range .Values.networkPolicy.allowedEgressCidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - port: 5432
          protocol: TCP
        - port: 6379
          protocol: TCP
        - port: 443
          protocol: TCP
        - port: 9000
          protocol: TCP
{{- end }}
