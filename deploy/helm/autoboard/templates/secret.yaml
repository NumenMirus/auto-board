{{- /* Dev-only inline Secret. Production / staging must set
       secrets.existingSecret to a Kubernetes Secret managed out-of-band
       (External Secrets Operator, SOPS, sealed-secrets, etc.) — this chart
       never renders credentials for those environments. */ -}}
{{- if and (not .Values.secrets.existingSecret) .Values.secrets.dev.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ default (printf "%s-dev" (include "autobreadboard.fullname" .)) .Values.secrets.dev.secretName }}
  labels:
    {{- include "autobreadboard.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ required "secrets.dev.databaseUrl is required when secrets.dev.enabled is true and no existingSecret is set" .Values.secrets.dev.databaseUrl | quote }}
  REDIS_URL: {{ required "secrets.dev.redisUrl is required when secrets.dev.enabled is true and no existingSecret is set" .Values.secrets.dev.redisUrl | quote }}
  S3_ACCESS_KEY_ID: {{ required "secrets.dev.s3AccessKeyId is required when secrets.dev.enabled is true and no existingSecret is set" .Values.secrets.dev.s3AccessKeyId | quote }}
  S3_SECRET_ACCESS_KEY: {{ required "secrets.dev.s3SecretAccessKey is required when secrets.dev.enabled is true and no existingSecret is set" .Values.secrets.dev.s3SecretAccessKey | quote }}
{{- end }}
