apiVersion: v1
kind: Service
metadata:
  name: {{ include "autoboard.fullname" . }}-api
  labels:
    {{- include "autoboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "autoboard.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
