{{- /* Application ConfigMap — every non-secret Settings field from
       backend/app/settings.py, uppercased. CORS_ORIGINS and TRUSTED_HOSTS are
       list[str] and must be rendered as JSON array strings (pydantic-settings
       parses them from a JSON array string). */ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "autoboard.fullname" . }}-config
  labels:
    {{- include "autoboard.labels" . | nindent 4 }}
data:
  ENVIRONMENT: {{ .Values.config.environment | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  S3_ENDPOINT_URL: {{ .Values.s3.endpointUrl | quote }}
  S3_REGION: {{ .Values.s3.region | quote }}
  S3_BUCKET: {{ .Values.s3.bucket | quote }}
  S3_USE_PATH_STYLE: {{ .Values.s3.usePathStyle | quote }}
  API_HOST: {{ .Values.config.apiHost | quote }}
  API_PORT: {{ .Values.config.apiPort | quote }}
  CORS_ORIGINS: {{ .Values.config.corsOrigins | toJson | quote }}
  TRUSTED_HOSTS: {{ .Values.config.trustedHosts | toJson | quote }}
  SOLVER_DEFAULT_TIMEOUT_SECONDS: {{ .Values.config.solverDefaultTimeoutSeconds | quote }}
  SOLVER_MAX_TIMEOUT_SECONDS: {{ .Values.config.solverMaxTimeoutSeconds | quote }}
  WORKER_CONCURRENCY: {{ .Values.worker.concurrency | quote }}
  WORKER_METRICS_PORT: {{ .Values.worker.metricsPort | quote }}
  WORKER_HEARTBEAT_PATH: {{ .Values.worker.heartbeatPath | quote }}
  JOB_LOCK_TTL_SECONDS: {{ .Values.config.jobLockTtlSeconds | quote }}
  EXPORT_RETENTION_DAYS: {{ .Values.config.exportRetentionDays | quote }}
  BUILD_SHA: {{ .Values.global.buildSha | quote }}
  IMAGE_TAG: {{ .Values.global.imageTag | quote }}
  {{- if .Values.config.otelExporterOtlpEndpoint }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.config.otelExporterOtlpEndpoint | quote }}
  {{- end }}
